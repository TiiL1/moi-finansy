<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b8a"><meta name="color-scheme" content="light dark"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Финансы"><title>Мои финансы</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><style>/* Раскладка: липкая шапка с вкладками; лента карточек шириной до 1180px; на телефоне — одна колонка. */
:root {
  --bg: #f2f5f6; --surface: #ffffff; --surface-2: #f6f9fa; --wash: #e7f1f5;
  --line: #dfe6e9; --line-2: #c9d4d8; --ink: #0f1f26; --ink-2: #44575f; --muted: #6f8289;
  --accent: #0b6b8a; --accent-ink: #ffffff; --accent-soft: #d5e9f0;
  --gold: #9c6f05; --gold-soft: #f6ead0;
  --good: #11743a; --good-bg: #e3f3e8; --bad: #b93636; --bad-bg: #fae8e8; --warn: #8a5d00; --warn-bg: #fbf0d6; --bad-solid: #b93636;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --grid: #e6ecee; --axis: #c3cdd1; --shadow: 0 1px 2px rgba(15, 31, 38, .06), 0 4px 16px rgba(15, 31, 38, .05);
  --f-display: "Unbounded", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px; --r-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1113; --surface: #131a1d; --surface-2: #182125; --wash: #122a33;
    --line: #233035; --line-2: #2f3e44; --ink: #e5edf0; --ink-2: #a6b5bb; --muted: #7c8d94;
    --accent: #4db3d7; --accent-ink: #062029; --accent-soft: #143845;
    --gold: #d8a944; --gold-soft: #33290f;
    --good: #45c475; --good-bg: #10281a; --bad: #f07272; --bad-bg: #2e1515; --bad-solid: #c53b3b; --warn: #e2ab40; --warn-bg: #2c220e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --grid: #1f2a2e; --axis: #33434a; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1113; --surface: #131a1d; --surface-2: #182125; --wash: #122a33;
  --line: #233035; --line-2: #2f3e44; --ink: #e5edf0; --ink-2: #a6b5bb; --muted: #7c8d94;
  --accent: #4db3d7; --accent-ink: #062029; --accent-soft: #143845;
  --gold: #d8a944; --gold-soft: #33290f;
  --good: #45c475; --good-bg: #10281a; --bad: #f07272; --bad-bg: #2e1515; --bad-solid: #c53b3b; --warn: #e2ab40; --warn-bg: #2c220e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --grid: #1f2a2e; --axis: #33434a; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 13px; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.ok i { background: var(--good); } .sync.busy i { background: var(--warn); } .sync.err i { background: var(--bad); } .sync.local i { background: var(--gold); }
.top-r { display: flex; gap: 10px; align-items: center; }
.hdr-add svg { width: 16px; height: 16px; }
@media (max-width: 760px) { .top-r .hdr-add { display: none; } }
@media (min-width: 761px) { .fab { display: none !important; } main { padding-bottom: 48px; } }
@media (max-width: 560px) { .brand p { display: none; } .brand h1 { font-size: 19px; } .sync { font-size: 12px; padding: 4px 9px; } .top-in { padding-block: 10px 4px; } }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; padding: 9px 12px 11px; color: var(--ink-2); font-weight: 500; font-size: 14.5px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab .t-short { display: none; }
@media (max-width: 560px) { .tab .t-long { display: none; } .tab .t-short { display: inline; } }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 20px 110px; display: grid; gap: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; }
.grid2 > * { min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tile .val { font-size: 20px; } .tile { padding: 12px 13px; } }
@media (max-width: 350px) { .tiles { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font-size: 16px; font-weight: 600; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.sec-h h2 { font-family: var(--f-display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* цель */
.goal { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 860px) { .goal { grid-template-columns: minmax(0, 1fr); } }
.hero-n { font-size: clamp(34px, 6vw, 48px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin-top: 4px; }
.hero-sub { color: var(--ink-2); margin-top: 4px; }
.bar { position: relative; height: 12px; background: var(--accent-soft); border-radius: 999px; margin: 16px 0 8px; overflow: visible; }
.bar > b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; min-width: 6px; }
.bar > i { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); border-radius: 2px; }
.bar-legend { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.fc-list { display: grid; gap: 10px; }
.fc-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.fc-row:last-child { border-bottom: 0; padding-bottom: 0; }
.fc-row b { font-weight: 600; }
.fc-main b { font-size: 20px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; }
.note.warn { background: var(--warn-bg); border-color: transparent; color: var(--ink); }

/* плитки */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.tile .lbl { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.tile .val { font-size: 24px; font-weight: 600; letter-spacing: -.01em; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* таблица «ключ — значение» */
.kv { display: grid; gap: 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv > div:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--ink-2); }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.kv .total { font-weight: 600; }

/* сегменты и кнопки */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); font-weight: 500; }
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { appearance: none; border: 0; background: none; padding: 6px; border-radius: 6px; cursor: pointer; color: var(--muted); line-height: 0; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.icon-btn svg { width: 17px; height: 17px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 13px 20px; font-weight: 600; font-size: 15px; box-shadow: 0 6px 20px rgba(11, 107, 138, .35); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.fab svg { width: 18px; height: 18px; }

/* распределение */
.alloc { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); margin: 6px 0 12px; }
.alloc > span { display: block; height: 100%; min-width: 3px; }
.legend { display: grid; gap: 0; }
.legend > div { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 56px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.legend > div:last-child { border-bottom: 0; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .v { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }
.legend .p { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }

/* графики */
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; }
.chart .tgt { stroke: var(--gold); stroke-width: 1.5; }
.chart .tgt-l { fill: var(--gold); font-weight: 500; }
.chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, .14); padding: 8px 10px; font-size: 12.5px; min-width: 170px; max-width: 260px; }
.tip h4 { margin: 0 0 4px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 1px 0; }
.tip .r span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .r b { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.tip .k { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend .k { width: 14px; height: 2px; border-radius: 1px; }
.chart-legend .k.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; }
.chart-legend .k.box { height: 10px; width: 10px; border-radius: 2px; }

/* таблицы */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th { font-weight: 500; color: var(--ink-2); background: var(--surface-2); font-size: 12.5px; position: sticky; top: 0; z-index: 1; white-space: normal; vertical-align: bottom; line-height: 1.3; }
table.t.dense th, table.t.dense td { padding: 8px 9px; }
table.t td.n, table.t th.n { text-align: right; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--wash); }
table.t tr.fc td { color: var(--muted); background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-2) 6px 7px); }
table.t tr.cur td { background: var(--wash); }
table.t tr.base td { font-weight: 600; }
table.t td:first-child, table.t th:first-child { position: sticky; left: 0; background: inherit; }
table.t tbody td:first-child { background: var(--surface); }
table.t tr.cur td:first-child { background: var(--wash); }
table.t tr.fc td:first-child { background: var(--surface); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); margin-left: 6px; vertical-align: 1px; }
.tag.fc { background: none; }
.mini-bar { display: inline-block; width: 46px; height: 6px; background: var(--accent-soft); border-radius: 3px; vertical-align: middle; margin-left: 6px; position: relative; overflow: hidden; }
.mini-bar b { position: absolute; inset: 0 auto 0 0; background: var(--accent); }

/* счета */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.accs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .accs { grid-template-columns: minmax(0, 1fr); } }
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.acc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.acc-h h3 { font-size: 15.5px; font-weight: 600; overflow-wrap: anywhere; }
.acc-h .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.acc .big { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.acc .kv > div { padding: 5px 0; font-size: 13.5px; }
.acc .acts { display: flex; gap: 6px; flex-wrap: wrap; }

/* операции */
.ops-tools { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .ops-tools { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .ops-tools .search { grid-column: 1 / -1; } }
.op-group { display: grid; }
.op-group h3 { font-size: 13px; color: var(--muted); font-weight: 500; padding: 14px 4px 6px; display: flex; justify-content: space-between; }
.op { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-top: 0; }
.op:first-of-type { border-top: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; }
.op:last-child { border-radius: 0 0 var(--r) var(--r); }
.op:only-of-type { border-radius: var(--r); }
.op .d { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.op .w { min-width: 0; }
.op .w b { font-weight: 500; font-size: 14px; }
.op .w div { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op .a { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.op .x { display: flex; gap: 0; }
.op.confirm { background: var(--bad-bg); }

/* формы */
.form { display: grid; gap: 14px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .fgrid, .fgrid.three { grid-template-columns: minmax(0, 1fr); } }
.fgrid .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 5px; font-size: 13px; color: var(--ink-2); min-width: 0; }
label.f > span small { color: var(--muted); }
.in { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; font-size: 15px; color: var(--ink); }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.in.bad { border-color: var(--bad); }
.in[readonly] { background: var(--surface-2); color: var(--ink-2); }
textarea.in { resize: vertical; min-height: 64px; }

// Ежемесячные взносы на будущее: массив начиная со следующего за `fromMk` месяца.
function saveSchedule(state, comp, fromMk, n, opt = {}) {
  const settings = state.settings || {};
  const mode = opt.mode || settings.fcMode || 'plan';
  const recs = state.months || {};
  const loans = loanSchedule(state, comp, n);
  let avg = null;
  if (mode === 'actual') {
    const rows = [];
    for (let k = 1; k <= 6 && rows.length < 3; k++) { const mk = addMonths(comp.curMk, -k); if (comp.months[mk] && (comp.months[mk].nOps || recs[mk])) rows.push(comp.months[mk].inK - comp.months[mk].outK); }
    avg = rows.length ? rows.reduce((a, b) => a + b, 0) / rows.length : null;
  }
  const out = [];
  for (let k = 1; k <= n; k++) {
    const mk = addMonths(fromMk, k);
    const pm = planMonth(settings, mk);
    const ov = recs[mk] && isNum(recs[mk].planSave) ? recs[mk].planSave : null;
    let s;
    if (ov != null) s = ov;
    else if (mode === 'custom') s = num(+settings.fcCustom);
    else if (mode === 'actual' && avg != null) s = avg;
    else s = planSave(settings, mk, null, loans[k - 1]);
    out.push({ mk, save: s, income: sumVals(monthPlanIncome(settings, mk)), exp: monthPlanExpenses(settings, mk),
      loan: pm && isNum(pm.loan) ? pm.loan : loans[k - 1], pmLoan: pm && isNum(pm.loan) ? pm.loan : null });
  }
  return out;
}

// Деньги на взнос с повышенным дисконтом для «упавших» видов (шок не меньше обычного дисконта)
function shockedAvail(state, comp, shock) {
  const settings = state.settings || {};
  // падение цены поверх обычного дисконта: сначала рынок упал, потом считаем консервативно, как всегда
  let A = 0;
  for (const a of state.accounts || []) {
    const o = comp.accs[a.id]; if (!o || !o.goal) continue;
    const sh = num(shock[a.cat]);
    A += o.valueK * (1 - Math.min(100, sh) / 100) * (1 - o.cut / 100);
  }
  return A;
}

// Прогноз денег на взнос: A(t+1) = A(t)·(1+r/12) + взнос(t+1), взнос в конце месяца.
// Множители и пропуски касаются только пополнений; плановые снятия (покупка машины) остаются как есть.
function forecast(state, comp, opt = {}) {
  const settings = state.settings || {};
  const G = goalInfo(settings);
  const horizon = opt.horizon || 240;
  const sched = saveSchedule(state, comp, comp.curMk, horizon, opt);
  let A = opt.start != null ? opt.start : comp.tot.avail;
  if (opt.shock) A = shockedAvail(state, comp, opt.shock);
  const r = (opt.rate != null ? opt.rate : comp.tot.goalRet) / 100;
  const i = r / 12;
  const target = opt.target != null ? opt.target : G.target;
  const pts = [{ mk: comp.curMk, A, own: A, inc: 0 }];
  let own = A, reach = A >= target ? comp.curMk : null, minA = A, minMk = comp.curMk;
  const skip = new Set(opt.skip || []);
  const extra = opt.extra || {};
  const pay = opt.payoff || null;
  for (let k = 0; k < sched.length; k++) {
    const m = sched[k];
    let s = m.save;
    if (s > 0) {
      if (opt.mul != null) s *= opt.mul;
      s += num(opt.add);
      if (opt.growth) s *= Math.pow(1 + opt.growth / 100, Math.floor(k / 12));
    }
    if (opt.incomeDrop) s -= m.income * opt.incomeDrop;
    if (opt.expUp) s -= m.exp * opt.expUp;
    if (pay) s += pay.model && m.pmLoan != null ? m.pmLoan : (k < pay.months ? pay.pay : 0);
    if (skip.has(k + 1) && s > 0) s = 0;
    s += num(extra[k + 1]);
    const interest = A > 0 ? A * i : 0;
    A = A + interest + s;
    own += s;
    if (A < minA) { minA = A; minMk = m.mk; }
    pts.push({ mk: m.mk, A, own, inc: A - own, save: s });
    if (reach == null && A >= target) reach = m.mk;
  }
  return { pts, reach, months: reach ? monthDiff(comp.curMk, reach) : null, target, rate: r * 100, start: pts[0].A, minA, minMk };
}
const valueAt = (fc, mk) => fc.pts.find(x => x.mk === mk) || null;

// Сколько откладывать, чтобы успеть к месяцу T при доходности r: S = (Ц − A·(1+i)^n − Σ разовые·(1+i)^(n−k))·i / ((1+i)^n − 1)
// extras — плановые разовые суммы [{k, amt}] (снятие с минусом), k — номер месяца от следующего
function requiredSave(A, target, ratePct, n, extras) {
  if (n <= 0) return null;
  const i = ratePct / 1200, g = Math.pow(1 + i, n);
  let fvx = 0;
  for (const x of extras || []) if (x.k >= 1 && x.k <= n) fvx += x.amt * Math.pow(1 + i, n - x.k);
  const need = target - A * g - fvx;
  if (need <= 0) return 0;
  return i === 0 ? need / n : need * i / (g - 1);
}

// ---------- калькулятор сложного процента ----------
// cap: 1 — ежемесячно, 3 — ежеквартально, 12 — ежегодно, 0 — без капитализации (доход выплачивается и лежит без процентов)
function compound(p) {
  const P = num(+p.P), C = num(+p.C), N = Math.max(0, Math.min(600, Math.round(num(+p.months))));
  const mrate = p.rateMode === 'month' ? num(+p.rate) / 100 : num(+p.rate) / 1200;
  const cap = p.cap == null ? 1 : +p.cap;
  const tax = num(+p.tax) / 100, fee = num(+p.fee) / 1200, growth = num(+p.growth) / 100;
  const start = p.timing === 'start';
  const skip = new Set((p.skip || []).map(Number));
  const extra = p.extra || {};
  let bal = P, accrued = 0, paid = 0, own = P, fees = 0, taxes = 0;
  const rows = [{ m: 0, contrib: P, bal: P, own: P, income: 0, total: P, interest: 0, accrued: 0 }];
  for (let m = 1; m <= N; m++) {
    const c = skip.has(m) ? 0 : C * Math.pow(1 + growth, Math.floor((m - 1) / 12));
    const x = num(extra[m]);
    if (start) { bal += c + x; own += c + x; }
    const gross = Math.max(0, bal) * mrate;
    const t = gross > 0 ? gross * tax : 0;
    const net = gross - t;
    taxes += t;
    const f = Math.max(0, bal) * fee;
    bal -= f; fees += f;
    if (cap > 0) { accrued += net; if (m % cap === 0) { bal += accrued; accrued = 0; } }
    else paid += net;
    if (!start) { bal += c + x; own += c + x; }
    const total = bal + accrued + paid;
    rows.push({ m, contrib: c + x, bal, accrued, paid, own, income: total - own, total, interest: net });
  }
  const last = rows[rows.length - 1];
  return { rows, final: last.total, own: last.own, income: last.total - last.own, fees, taxes, share: last.total > 0 ? (last.total - last.own) / last.total : 0 };
}
function compoundCompare(p) {
  const v = (over) => compound({ ...p, ...over });
  return [
    { key: 'none', name: 'Без дохода (просто копить)', r: v({ rate: 0 }) },
    { key: 'simple', name: 'Простой процент — доход не реинвестируется', r: v({ cap: 0 }) },
    { key: 'm', name: 'Капитализация каждый месяц', r: v({ cap: 1 }) },
    { key: 'q', name: 'Капитализация раз в квартал', r: v({ cap: 3 }) },
    { key: 'y', name: 'Капитализация раз в год', r: v({ cap: 12 }) },
  ];
}
// Эффективная годовая доходность при заданной частоте капитализации (без налога и комиссии)
function effectiveYear(p) {
  const m = p.rateMode === 'month' ? num(+p.rate) / 100 : num(+p.rate) / 1200;
  const cap = p.cap == null ? 1 : +p.cap;
  if (cap === 0) return m * 12;
  return Math.pow(1 + m * cap, 12 / cap) - 1;
}

// ---------- сценарии «Что будет, если» ----------
// o.rate — доходность из прогноза (с учётом ручной поправки), o.mode/o.custom — как откладывать
function scenarios(state, comp, o = {}) {
  const settings = state.settings || {};
  const G = goalInfo(settings);
  const tMk = G.targetMk || addMonths(comp.curMk, 30);
  const base = { horizon: 240 };
  if (o.rate != null) base.rate = o.rate;
  if (o.mode) base.mode = o.mode;
  const st0 = o.mode === 'custom' ? { ...state, settings: { ...settings, fcCustom: num(o.custom) } } : state;
  const loans = (state.accounts || []).filter(a => isLiab(a) && comp.accs[a.id] && comp.accs[a.id].debt > 0.5);
  const debt = loans.reduce((s, a) => s + comp.accs[a.id].debt, 0);
  const pay = loans.reduce((s, a) => s + num(+a.payment), 0);
  const payoffN = loans.reduce((m, a) => Math.max(m, num(comp.accs[a.id].payoff === Infinity ? 240 : comp.accs[a.id].payoff)), 0);
  const modelMode = (settings.planMode || 'rule') === 'model' && (o.mode || settings.fcMode || 'plan') === 'plan';
  const list = [
    { key: 'base', name: 'Базовый: как в прогнозе', opt: {}, base: true },
    { key: 's100', name: 'Откладывать 100 тыс. ₸ в месяц', opt: { fixed: 100000 } },
    { key: 's200', name: 'Откладывать 200 тыс. ₸ в месяц', opt: { fixed: 200000 } },
    { key: 's300', name: 'Откладывать 300 тыс. ₸ в месяц', opt: { fixed: 300000 } },
    { key: 'grow', name: 'Каждый год откладывать на 10% больше', opt: { growth: 10 } },
    { key: 'inc20', name: 'Доход упал на 20%', opt: { incomeDrop: 0.2 } },
    { key: 'exp20', name: 'Расходы выросли на 20%', opt: { expUp: 0.2 } },
    { key: 'skip3', name: 'Пропустить 3 пополнения (месяцы 2–4)', opt: { skip: [2, 3, 4] } },
    { key: 'car', name: 'Ремонт машины: снять 300 тыс. ₸ через 3 месяца', opt: { extra: { 3: -300000 } } },
    { key: 'r0', name: 'Без дохода от вложений (0%)', opt: { rate: 0 } },
    { key: 'shock', name: 'Рынок упал: акции −30%, крипта −60% (сверх обычного дисконта)', opt: { shock: { stock: 30, crypto: 60 } } },
  ];
  if (debt > 0.5) {
    const enough = comp.tot.avail >= debt;
    list.push({ key: 'payoff', name: enough ? `Закрыть кредиты сейчас (${compact(debt)}) из накоплений — платёж уходит в накопления`
      : `Закрыть кредиты сейчас (${compact(debt)}) — накоплений не хватает`, na: !enough,
      opt: { start: comp.tot.avail - debt, payoff: { months: payoffN, pay, model: modelMode } } });
  }
  list.push({ key: 'm15', name: '1,5% в месяц — выше реальных ставок, только для сравнения', opt: { rate: 18 }, optimistic: true });
  return list.map(sc => {
    if (sc.na) return { ...sc, reach: null, months: null, atTarget: null, own: null, inc: null };
    const op = { ...base, ...sc.opt };
    let s2 = st0;
    if (op.fixed != null) { s2 = { ...state, settings: { ...settings, fcCustom: op.fixed } }; op.mode = 'custom'; }
    const fc = forecast(s2, comp, op);
    const atT = tMk <= comp.curMk ? fc.pts[0] : (valueAt(fc, tMk) || fc.pts[fc.pts.length - 1]);
    return { ...sc, reach: fc.reach, months: fc.months, atTarget: atT.A, own: atT.own, inc: atT.inc, rate: fc.rate, minA: fc.minA, start: fc.start };
  });
}

// ---------- настройки по умолчанию и нормализация ----------

// Достраивает недостающие поля настроек значениями по умолчанию, чтобы старые или чужие данные не ломали страницу
function normalizeSettings(s) {
  const d = defaultSettings();
  if (!isObj(s)) return d;
  const out = { ...d, ...s };
  out.goal = { ...d.goal, ...(isObj(s.goal) ? s.goal : {}) };
  out.sources = Array.isArray(s.sources) ? s.sources.filter(isObj).map((x, k) => ({ ...x, id: String(x.id || 'src' + k), name: String(x.name ?? '') })) : d.sources;
  out.rates = Array.isArray(s.rates) ? s.rates.filter(r => isObj(r) && validDate(r.d)) : d.rates;
  out.rule = { ...d.rule, ...(isObj(s.rule) ? s.rule : {}) };
  out.rule.pcts = isObj(out.rule.pcts) ? out.rule.pcts : {};
  out.rets = { ...d.rets, ...(isObj(s.rets) ? s.rets : {}) };
  out.cuts = { ...d.cuts, ...(isObj(s.cuts) ? s.cuts : {}) };
  out.plan = isObj(s.plan) && Array.isArray(s.plan.months) ? { ...s.plan, months: s.plan.months.filter(m => isObj(m) && validMk(m.m)) } : { months: [] };
  if (!['model', 'rule', 'fixed'].includes(out.planMode)) out.planMode = 'rule';
  if (out.planMode === 'model' && !out.plan.months.length) out.planMode = 'rule';
  return out;
}

// ---------- проверка импорта ----------
const ID_RE = /^(?!\.{1,2}$)[A-Za-z0-9_\-.~:@+]{1,80}$/;
function validateImport(obj) {
  const errors = [], warnings = [];
  if (!isObj(obj)) return { ok: false, errors: ['Файл не похож на резервную копию: нужен JSON-объект.'], warnings, counts: {} };
  if (obj.app && obj.app !== 'moi-finansy') warnings.push(`В файле указано приложение «${String(obj.app).slice(0, 40)}».`);
  const accounts = Array.isArray(obj.accounts) ? obj.accounts : [];
  const ops = Array.isArray(obj.ops) ? obj.ops : [];
  const months = isObj(obj.months) ? obj.months : {};
  if (!Array.isArray(obj.accounts)) errors.push('Нет списка счетов (accounts).');
  if (!Array.isArray(obj.ops)) errors.push('Нет журнала операций (ops).');
  if (obj.settings != null) {
    const s = obj.settings;
    if (!isObj(s)) errors.push('Настройки (settings) — не объект.');
    else {
      if (s.goal != null && !isObj(s.goal)) errors.push('Настройки: цель (goal) — не объект.');
      if (s.sources != null && !Array.isArray(s.sources)) errors.push('Настройки: источники дохода (sources) — не список.');
      if (s.rates != null && !Array.isArray(s.rates)) errors.push('Настройки: курсы (rates) — не список.');
      if (s.plan != null && !(isObj(s.plan) && Array.isArray(s.plan.months))) errors.push('Настройки: план (plan.months) — не список.');
    }
  }
  const ids = new Set();
  accounts.forEach((a, k) => {
    const w = `Счёт №${k + 1}`;
    if (!isObj(a)) { errors.push(`${w}: не объект.`); return; }
    if (!ID_RE.test(String(a.id || ''))) errors.push(`${w}: неверный id.`);
    else if (ids.has(a.id)) errors.push(`${w}: id «${a.id}» повторяется.`); else ids.add(a.id);
    if (!a.name || typeof a.name !== 'string') errors.push(`${w}: нет названия.`);
    if (!CATS[a.cat]) errors.push(`${w}: неизвестный вид «${a.cat}».`);
    if (a.ccy && !/^[A-Z]{3}$/.test(a.ccy)) errors.push(`${w}: валюта должна быть кодом из трёх букв.`);
  });
  const opIds = new Set();
  ops.forEach((o, k) => {
    const w = `Операция №${k + 1}`;
    if (!isObj(o)) { errors.push(`${w}: не объект.`); return; }
    if (!ID_RE.test(String(o.id || ''))) errors.push(`${w}: неверный id.`);
    else if (opIds.has(o.id)) errors.push(`${w}: id повторяется.`); else opIds.add(o.id);
    if (!OPS[o.type]) errors.push(`${w}: неизвестный тип «${o.type}».`);
    if (!validDate(o.date)) errors.push(`${w}: неверная дата «${o.date}».`);
    if (!ids.has(o.acc)) errors.push(`${w}: счёт «${o.acc}» не найден.`);
    if (o.type === 'xfer' && !ids.has(o.acc2)) errors.push(`${w}: второй счёт не найден.`);
    if ((o.type === 'borrow' || o.type === 'pay') && o.acc2 && !ids.has(o.acc2)) errors.push(`${w}: второй счёт не найден.`);
    if (o.type !== 'val' && (!isNum(o.amt) || o.amt < 0)) errors.push(`${w}: сумма должна быть числом не меньше нуля.`);
    if (o.type === 'val' && !isNum(o.value) && !isNum(o.price)) errors.push(`${w}: нет новой стоимости.`);
  });
  for (const [mk, v] of Object.entries(months)) {
    if (!validMk(mk)) errors.push(`Месяц «${mk}»: неверный формат, нужен ГГГГ-ММ.`);
    else if (!isObj(v)) errors.push(`Месяц ${mk}: не объект.`);
  }
  if (obj.story != null && !isObj(obj.story)) errors.push('Отметки пути (story) — не объект.');
  else for (const [mk, v] of Object.entries(obj.story || {})) if (!validMk(mk) || !isObj(v)) errors.push(`Отметки пути за «${mk}»: неверный формат.`);
  const rates = isObj(obj.settings) && Array.isArray(obj.settings.rates) ? obj.settings.rates : null;
  if (rates) for (const c of new Set(accounts.filter(a => isObj(a) && a.ccy && a.ccy !== 'KZT').map(a => a.ccy)))
    if (!rates.some(r => isObj(r) && isNum(r[c]))) warnings.push(`Нет курса ${c} — добавьте его в «Настройках» после загрузки.`);
  if (errors.length > 12) { const n = errors.length; errors.length = 12; errors.push(`…и ещё ${n - 12} ошибок.`); }
  return { ok: errors.length === 0, errors, warnings, counts: { accounts: accounts.length, ops: ops.length, months: Object.keys(months).length, settings: !!obj.settings, story: isObj(obj.story) ? Object.keys(obj.story).length : 0 } };
}
// Подпись операции для поиска дублей: все поля, которые меняют смысл записи
const opSig = o => [o.date, o.type, o.acc, o.acc2 || '', r2(num(o.amt)), num(o.qty), o.kind || '', isNum(o.value) ? r2(o.value) : '', isNum(o.price) ? o.price : '',
  o.side || '', o.purpose || '', isNum(o.amt2) ? r2(o.amt2) : '', num(o.qty2), isNum(o.bal) ? r2(o.bal) : ''].join('|');
function mergePlan(cur, inc) {
  const accIds = new Set((cur.accounts || []).map(a => a.id));
  const opIds = new Set((cur.ops || []).map(o => o.id));

  const addAcc = (inc.accounts || []).filter(a => !accIds.has(a.id));
  const addOps = [], dup = [];
  // дубли ищем только среди уже сохранённых: одинаковые записи внутри файла — это разные операции с разными id
  for (const o of inc.ops || []) { if (opIds.has(o.id) || sigs.has(opSig(o))) dup.push(o); else addOps.push(o); }

  const addStory = Object.keys(isObj(inc.story) ? inc.story : {}).filter(mk => !(cur.story || {})[mk]);
  return { addAcc, addOps, dup, addMonths: addMonthsList, addStory };

// ---------- CSV (Excel в русской раскладке: «;» и запятая в дробях) ----------

function opsCSV(state) {

// Проверка нагрузки для ипотеки: платежи по всем кредитам к официальному доходу (банки требуют не больше 50%)
function mortgageCheck(S, G, tMk) {
  const loanAmt = Math.max(0, G.price - G.down);
  const mpay = FC.annuity(loanAmt, G.mortRate, G.mortYears);
  const srcs = S.settings.sources || [];
  const offic = srcs.filter(x => x.official);
  const list = offic.length ? offic : srcs.filter(x => x.id === 'sal').slice(0, 1);
  const incT = FC.monthPlanIncome(S.settings, tMk), incP = FC.monthPlanIncome(S.settings, comp.curMk);
  // доход сейчас: последний внесённый факт за 3 месяца, иначе план текущего месяца; на дату покупки — план (с ростом зарплаты)
  const factOf = id => { for (let k = 0; k <= 3; k++) { const r = (S.months || {})[FC.addMonths(comp.curMk, -k)]; if (r && r.inc && isNum(r.inc[id])) return r.inc[id]; } return null; };
  const incomeNow = list.reduce((s, x) => s + num(factOf(x.id) ?? incP[x.id]), 0);
  const incomeT = list.reduce((s, x) => s + num(incT[x.id]), 0);
  const n = Math.max(1, FC.monthDiff(comp.curMk, tMk));
  const other = n <= 240 ? FC.loanSchedule(S, comp, n)[n - 1] || 0 : 0;
  return { loanAmt, mpay, other, income: incomeNow, ratio: incomeNow > 0 ? (mpay + other) / incomeNow : null,
    ratioT: incomeT > 0 ? (mpay + other) / incomeT : null, incomeT, names: list.map(x => x.name).join(', ') };
}

function pathData() {
  const S = st(), resInc = reserveIncome();
  return FC.story(S.settings, comp.curMk, Store.data.story, mk => {
    const r = FC.monthRow(S, comp, mk);

// Проценты на резервных счетах по месяцам, ₸: по плану модели они тоже идут в «отложить» («из них ≈3 тыс. — проценты по резерву»)
function reserveIncome() {
  const out = {};

    const A = accById(o.acc); if (!A || !A.reserve) continue;
    const r = A.ccy && A.ccy !== 'KZT' ? num(o.fx) || num(FC.rateAt(settings().rates, A.ccy, o.date)) : 1;
    const mk = FC.mkOf(o.date);

const SHARE_KINDS = [['save', 'Накопления'], ['inv', 'Вложения'], ['path', 'Путь']];
const IMG = { ink: '#ffffff', ink2: 'rgba(255,255,255,.76)', muted: 'rgba(255,255,255,.52)', track: 'rgba(255,255,255,.13)', tile: 'rgba(255,255,255,.07)',

function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
// Текст в одну строку: шрифт уменьшается, пока не влезет в ширину
function fitText(g, text, x, y, maxW, weight, px, family, color) {
  let s = px; g.font = `${weight} ${s}px ${family}`;
  while (s > 14 && g.measureText(text).width > maxW) { s -= 2; g.font = `${weight} ${s}px ${family}`; }

}
// Перенос по словам, не больше maxLines строк; последняя обрезается многоточием
function wrapText(g, text, x, y, maxW, lh, maxLines) {
  const words = String(text).split(/\s+/); let line = '', n = 0;

    if (g.measureText(tryL).width <= maxW || !line) { line = tryL; continue; }

      { name: 'Доход вложений', color: 'var(--s2)', values: comp.snaps.map(x => x.result), area: true },
    ] };
  }
  if (UI.chart === 'debt') {
    const loans = loanAccs(true);
    if (!loans.length) return null;
    const xs = comp.snaps.map(x => x.mk);
    const vals = comp.snaps.map(x => x.debt);
    let D = loans.map(a => ({ d: comp.accs[a.id] ? comp.accs[a.id].debt : 0, i: num(+a.rate) / 1200, p: num(+a.payment) }));
    const fx = [], fv = [];
    for (let k = 1; k <= 60 && D.some(x => x.d > 0.5 && x.p > 0); k++) {
      D = D.map(x => { if (x.d <= 0.5 || x.p <= 0) return x; return { ...x, d: Math.max(0, x.d * (1 + x.i) - x.p) }; });
      fx.push(FC.addMonths(comp.curMk, k)); fv.push(D.reduce((s2, x) => s2 + x.d, 0));
    }
    return { x: [...xs, ...fx], series: [
      { name: 'Остаток долга', color: 'var(--s8)', values: [...vals, ...fx.map(() => null)], dot: true },
      { name: 'Прогноз по текущим платежам', color: 'var(--s8)', dash: true, values: [...vals.map((v, i) => (i === vals.length - 1 ? v : null)), ...fv] },
    ], now: xs.length - 1 };
  }
  return null;
}
function legendHtml(cfg) {

const LIQ = { goal: ['На взнос', 1], reserve: ['Резерв', 4], locked: ['Не на взнос: имущество, бизнес', 6] };

// ---------- месяцы ----------
function monthsList() {

  const planFirst = s.planMode === 'model' ? ((s.plan || {}).months || [])[0] : null;
  if (planFirst && planFirst.m <= comp.curMk) for (let mk = planFirst.m; mk <= comp.curMk; mk = FC.addMonths(mk, 1)) set.add(mk);
  set.add(comp.curMk);

}
function vMonths() {

      <td class="n">${C(r.loan)}</td><td class="n">${C(r.incomeTotal - r.expenses - num(r.loan))}</td><td class="n">—</td><td class="n">—</td><td class="n">—</td></tr>`;
    return `<tr class="${cls}"${act}>${head}
      <td class="n"><b>${C(r.saved)}</b></td><td class="n">${r.plan != null ? C(r.plan) : '—'}</td>

      <td class="n">${C(r.avail)}</td><td class="n">${pctGoal(r.avail)}</td>
      <td class="n">${r.incomeTotal != null ? C(r.incomeTotal) : '<span class="muted">—</span>'}</td><td class="n">${r.expenses != null ? C(r.expenses) : '<span class="muted">—</span>'}</td>
      <td class="n">${r.loan ? C(r.loan) : '0'}</td><td class="n">${r.free != null ? C(r.free) : '—'}</td>
      <td class="n">${r.invInc ? `<span class="pos">${FC.signed(r.invInc, C)}</span>` : '0'}</td><td class="n">${C(r.value)}</td>
      <td class="n">${r.dValue != null ? FC.signed(r.dValue, C) : '—'}</td></tr>`;

// ---------- счета ----------
function vAccounts() {

  const cats = [...new Set(all.map(a => a.cat))].sort((a, b) => CAT_ORDER.indexOf(a) - CAT_ORDER.indexOf(b));
  const ccys = [...new Set(all.map(a => a.ccy || 'KZT'))];
  const plats = [...new Set(all.map(a => (a.platform || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
  if (f.cat !== 'all' && !cats.includes(f.cat)) f.cat = 'all';

  const loans = loanAccs(f.arch);
  return `

  <div class="sec-h"><h2>Кредиты</h2>${Store.canWrite ? '<button class="btn" data-act="acc-new" data-cat="loan">Добавить кредит</button>' : ''}</div>

const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
function accCard(a) {
  const o = comp.accs[a.id] || {};

  const foreign = (a.ccy || 'KZT') !== 'KZT';
  const prop = !FC.inPort(a);
  const lines = [];
  lines.push([prop ? 'Вложено в покупку' : 'Вложено своих', M(o.netInK - num(o.borrowed)) + (o.borrowed ? ` <span class="muted">+ кредит ${C(o.borrowed)}</span>` : '')]);

  if (o.costsK) lines.push(['Комиссии и налоги', `<span class="neg">−${M(o.costsK)}</span>`]);

  if (foreign) {
    const pc = o.netIn > 0.005 ? ` <span class="muted">(${sp(o.resultC / o.netIn)})</span>` : '';

      <div class="meta"><span class="sw" style="background:${catColor(a.cat)}"></span>${esc(CATS[a.cat].name)}${a.platform ? ' · ' + esc(a.platform) : ''} · ${esc(a.ccy || 'KZT')}${a.reserve ? ' <span class="pill gold">резерв</span>' : ''}</div></div>
      ${Store.canWrite ? `<button class="icon-btn" data-act="acc-edit" data-id="${a.id}" aria-label="Изменить счёт ${esc(a.name)}">${ICON.edit}</button>` : ''}</div>
    <div><div class="big">${M(o.valueK)}</div><div class="small muted">${foreign ? `${M(o.value, a.ccy)} по курсу ${FC.grp(o.rate, 2)} · ` : ''}${P(share, 0)} всех активов</div></div>

    <div class="acts">

      <button class="btn sm" data-act="op-new" data-type="xfer" data-acc="${a.id}">Перевести</button>

// ---------- операции ----------
function opsFiltered() {
  const f = UI.of, q = f.q.trim().toLowerCase().replace(/[\s  ]/g, '');
  const cur = comp.curMk;
  const from = f.per === 'm1' ? cur : f.per === 'm3' ? FC.addMonths(cur, -2) : f.per === 'm12' ? FC.addMonths(cur, -11) : null;
  return Store.data.ops.filter(o => {
    if (f.type !== 'all' && o.type !== f.type) return false;
    if (f.acc !== 'all' && o.acc !== f.acc && o.acc2 !== f.acc) return false;
    if (from && FC.mkOf(o.date) < from) return false;
    if (q) {
      const d = opDesc(o);
      const nums = ['amt', 'amt2', 'value', 'price', 'qty', 'qty2'].filter(k => isNum(o[k])).map(k => `${o[k]} ${fmtIn(o[k])} ${String(o[k]).replace('.', ',')}`);
      const hay = [o.note, d.t, d.d, d.amt, o.date, ...nums].join(' ').toLowerCase().replace(/[\s  ]/g, '');
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : num(b.ts) - num(a.ts)));
}
function vOps() {

    <select class="in" id="of-per" data-act-change="of" data-k="per" aria-label="Период">${[['all', 'Всё время'], ['m1', 'Этот месяц'], ['m3', '3 месяца'], ['m12', '12 месяцев']].map(([k, n]) => `<option value="${k}" ${f.per === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
  </div>
  <div id="ops-list">${opsListHtml()}</div>`;
}
function opsListHtml() {
  const list = opsFiltered();
  if (!list.length) return Store.data.ops.length ? '<div class="card empty"><p class="muted">Ничего не нашлось. Измените поиск или фильтры.</p></div>'
    : `<div class="card empty"><h3>Журнал пуст</h3><p class="muted">Записывайте сюда пополнения, снятия, переводы, проценты и дивиденды — капитал и доходность посчитаются сами.</p>${Store.canWrite ? '<button class="btn pri" data-act="op-new">Первая запись</button>' : ''}</div>`;
  const shown = list.slice(0, UI.opsLimit);
  const groups = {};
  for (const o of shown) (groups[FC.mkOf(o.date)] = groups[FC.mkOf(o.date)] || []).push(o);
  return Object.entries(groups).map(([mk, ops]) => `<div class="op-group"><h3><span>${esc(cap(FC.mkLong(mk)))}</span><span>${ops.length} ${plural(ops.length, 'запись', 'записи', 'записей')}</span></h3>${ops.map(opRow).join('')}</div>`).join('')
    + (list.length > shown.length ? `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="ops-more">Показать ещё (${list.length - shown.length})</button></div>` : '');
}
function opDesc(o) {
  const a = accById(o.acc) || { name: '?', ccy: 'KZT' }, b = accById(o.acc2);
  const ccy = a.ccy || 'KZT';
  const q = isNum(o.qty) && o.qty > 0 ? ` · ${qtyTxt(o.qty)} шт.` : '';
  switch (o.type) {
    case 'open': return { t: 'Начальный остаток', d: a.name + q, amt: M(o.amt, ccy), cls: '' };
    case 'in': return { t: 'Пополнение', d: a.name + q, amt: '+' + M(o.amt, ccy), cls: '' };
    case 'out': return { t: `Снятие ${OUT_PURPOSE[o.purpose || 'spend'] || ''}`, d: a.name + q, amt: '−' + M(o.amt, ccy), cls: '' };
    case 'xfer': return { t: 'Перевод', d: `${a.name} → ${b ? b.name : '?'}${isNum(o.qty2) && o.qty2 > 0 ? ` · куплено ${qtyTxt(o.qty2)} шт.` : q}${isNum(o.amt2) && b && (b.ccy || 'KZT') !== ccy ? ` · зачислено ${M(o.amt2, b.ccy)}` : ''}`, amt: M(o.amt, ccy), cls: 'muted' };
    case 'trade': return { t: o.side === 'sell' ? 'Продажа на счёте' : 'Покупка на счёте', d: a.name + q, amt: M(o.amt, ccy), cls: 'muted' };
    case 'inc': { const net = num(o.amt) - num(o.tax) - num(o.fee); return { t: INC_KINDS[o.kind] || 'Доход', d: a.name + (o.tax || o.fee ? ` · до налога ${M(o.amt, ccy)}` : ''), amt: '+' + M(net, ccy), cls: 'pos' }; }
    case 'cost': return { t: o.kind === 'tax' ? 'Налог' : 'Комиссия', d: a.name, amt: '−' + M(o.amt, ccy), cls: 'neg' };
    case 'val': return FC.isLiab(a) ? { t: 'Остаток долга', d: a.name, amt: M(o.value, ccy), cls: 'muted' }
      : { t: isNum(o.price) ? 'Новая цена' : 'Новая стоимость', d: a.name, amt: isNum(o.price) ? `${M(o.price, ccy)} за 1 шт.` : M(o.value, ccy), cls: 'muted' };
    case 'pay': return { t: 'Платёж по кредиту', d: a.name + (b ? ` · из «${b.name}»` : ' · из дохода'), amt: '−' + M(o.amt), cls: '' };
    case 'borrow': return { t: 'Получен кредит', d: `${a.name}${b ? ' → ' + b.name : ' · сразу в покупку'}`, amt: M(o.amt), cls: '' };
  }
  return { t: o.type, d: '', amt: '', cls: '' };
}
let confirmDel = null;
const DAY_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

// ---------- прогноз ----------
function calcDefaults() {
  const t = comp.tot, G = FC.goalInfo(settings()), o = fcOpts(), S = st();
  const months = Math.max(1, FC.monthDiff(comp.curMk, G.targetMk && G.targetMk > comp.curMk ? G.targetMk : FC.addMonths(comp.curMk, 30)));
  const stt = o.mode === 'custom' ? { ...S, settings: { ...S.settings, fcCustom: o.custom } } : S;
  const sched = FC.saveSchedule(stt, comp, comp.curMk, months, { mode: o.mode });
  // обычные пополнения — среднее по месяцам; плановые снятия (покупка машины) — разовыми суммами
  const avg = sched.reduce((a, x) => a + Math.max(0, x.save), 0) / months;
  const extra = sched.map((x, k) => (x.save < -0.5 ? `${k + 1}: ${Math.round(x.save)}` : null)).filter(Boolean).join('; ');
  return { P: Math.round(t.avail / 1000) * 1000, C: Math.max(0, Math.round(avg / 1000) * 1000), rate: FC.r2(fcOpts().rate), rateMode: 'year',
    months, timing: 'end', cap: 1, growth: 0, tax: 0, fee: 0, skip: '', extra, m: null };
}
function vForecast() {
  const S = st(), s = S.settings, G = FC.goalInfo(s);
  const F = forecastsFor(S);
  const o = fcOpts();
  const tMk = G.targetMk || FC.addMonths(comp.curMk, 30);
  const planM = s.planMode === 'model' ? (s.plan && s.plan.months) || [] : [];
  let last = [F.pess.reach, F.base.reach, F.opt.reach, tMk].filter(Boolean).sort().pop();
  if (FC.monthDiff(comp.curMk, last) > 84) last = FC.addMonths(comp.curMk, 84);
  if (last <= comp.curMk) last = FC.addMonths(comp.curMk, 12);
  let first = comp.snaps.length ? comp.snaps[0].mk : comp.curMk;
  if (FC.monthDiff(first, comp.curMk) > 24) first = FC.addMonths(comp.curMk, -24);
  const xs = []; for (let mk = first; mk <= last; mk = FC.addMonths(mk, 1)) xs.push(mk);
  const by = fc => Object.fromEntries(fc.pts.map(p => [p.mk, p.A]));
  const b1 = by(F.pess), b2 = by(F.base), b3 = by(F.opt), sn = Object.fromEntries(comp.snaps.map(x => [x.mk, x.avail])), pl = planPath(planM);
  CHARTS.fc = { x: xs, series: [
    ...(planM.length ? [{ name: 'План из модели', color: 'var(--s2)', values: xs.map(mk => pl[mk] ?? null) }] : []),
    { name: 'Факт', color: 'var(--s1)', values: xs.map(mk => sn[mk] ?? null), dot: true },
    { name: 'Если хуже', color: 'var(--s8)', dash: true, values: xs.map(mk => b1[mk] ?? null) },
    { name: 'Если лучше', color: 'var(--s3)', dash: true, values: xs.map(mk => b3[mk] ?? null) },
    { name: 'Базовый', color: 'var(--s1)', dash: true, values: xs.map(mk => b2[mk] ?? null) },
  ], target: { y: G.target, label: `цель ${C(G.target)}` }, now: xs.indexOf(comp.curMk) };
  const scs = FC.scenarios(S, comp, { rate: o.rate, mode: o.mode, custom: o.custom });
  if (!UI.calc) UI.calc = calcDefaults();
  const c = UI.calc;
  const card = (title, fc, sub) => `<div class="card flat"><div class="eyebrow">${title}</div><div style="font-size:22px;font-weight:600;margin-top:4px">${reachTxt(fc)}</div><div class="small ink2">${inTxt(fc)}</div><div class="small muted" style="margin-top:6px">${sub}</div></div>`;

  return `

    <div class="row" style="margin-bottom:14px">
      <span class="small ink2">Сколько откладывать в прогнозе:</span>
      <div class="seg" role="group" aria-label="Взносы в прогнозе">${[['plan', 'По плану'], ['actual', 'Как за 3 мес.'], ['custom', 'Своя сумма']].map(([k, n]) => `<button data-act="fc-mode" data-v="${k}" aria-pressed="${o.mode === k}">${n}</button>`).join('')}</div>
      ${o.mode === 'custom' ? `<input class="in" id="fc-custom" style="width:150px" inputmode="decimal" placeholder="150 000" value="${esc(UI.fc.custom)}" data-act-change="fc-custom" aria-label="Сумма в месяц">` : ''}
      <span class="small ink2">Доходность, % годовых:</span>
      <input class="in" id="fc-rate" style="width:110px" inputmode="decimal" placeholder="${FC.grp(comp.tot.goalRet, 1)}" value="${esc(UI.fc.rate)}" data-act-change="fc-rate" aria-label="Доходность">
    </div>

      ${card('Если хуже', F.pess, `пополнения на 20% меньше, доходность ${rateTxt(Math.max(0, F.rate - 3))}, акции и крипта с дисконтом`)}
      ${card('Базовый прогноз', F.base, `доходность ${rateTxt(F.rate)}, взносы ${fcModeTxt()}`)}
      ${card('Если лучше', F.opt, `пополнения на 10% больше, доходность ${rateTxt(F.rate + 2)}, по рыночной стоимости`)}
    </div>
    ${F.base.minA < -1000 ? `<div class="note warn small" style="margin-top:12px">По плану в ${esc(FC.mkPrep(F.base.minMk))} денег на взнос не хватает ${C(-F.base.minA)}: снятие из накоплений больше, чем накоплено.</div>` : ''}
    <div class="chart" id="chart-fc" data-chart="fc" tabindex="0" style="margin-top:16px" aria-label="График прогноза"></div>${legendHtml(CHARTS.fc)}
    <p class="small muted" style="margin:10px 0 0">Прогноз: каждый месяц деньги на взнос растут на доходность/12, в конце месяца добавляется взнос. Плановые снятия (например, покупка машины) в вариантах «хуже» и «лучше» не меняются. Будущая доходность и цены не известны — это оценка, а не обещание. Пессимистичный вариант — не худший из возможных.</p>
  </section>

  <div class="sec-h"><h2>Калькулятор сложного процента</h2><button class="btn ghost sm" data-act="calc-reset">Подставить мои данные</button></div>
  <section class="card">

        <label class="f"><span>Проценты прибавляются</span><select class="in" id="c-cap" data-calc="cap">${[[1, 'каждый месяц'], [3, 'раз в квартал'], [12, 'раз в год'], [0, 'не прибавляются — выплачиваются']].map(([k, n]) => `<option value="${k}" ${+c.cap === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>

const CALC_NAMES = { P: 'начальная сумма', C: 'пополнение', rate: 'доходность', months: 'срок', growth: 'рост пополнений', tax: 'налог', fee: 'комиссия' };
function parseCalc(c) {
  const bad = [], badFields = [];
  // число из поля; непонятный текст не превращаем молча в ноль
  const nf = k => { const s = String(c[k] ?? '').trim(); if (!s) return 0; const v = FC.parseNum(s); if (isNum(v)) return v; bad.push(`${CALC_NAMES[k]} «${s}»`); badFields.push(k); return 0; };
  const p = { P: nf('P'), C: nf('C'), rate: nf('rate'), rateMode: c.rateMode, timing: c.timing, cap: +c.cap, growth: nf('growth'), tax: nf('tax'), fee: nf('fee') };
  p.months = Math.min(600, Math.max(1, Math.round(nf('months')) || 1));
  const skip = [];
  for (const part of String(c.skip || '').replace(/\s*[-–—]\s*/g, '-').split(/[,;\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) { bad.push(`пропуск «${part}»`); continue; }
    const a = +m[1], b = m[2] ? +m[2] : a;
    if (Math.max(a, b) > p.months || Math.min(a, b) < 1) { bad.push(`пропуск «${part}» вне срока`); continue; }
    for (let k = Math.min(a, b); k <= Math.max(a, b); k++) skip.push(k);
  }
  // разовые суммы: «месяц: сумма», элементы разделяются «;», «,» или просто следующим «N:»
  const extra = {};
  const ex = String(c.extra || '');
  const heads = [...ex.matchAll(/(\d+)\s*:/g)];
  const lead = (heads.length ? ex.slice(0, heads[0].index) : ex).replace(/[;,\s]/g, '');
  if (lead) bad.push(`разовые «${lead}»`);
  heads.forEach((h, i) => {
    const raw = ex.slice(h.index + h[0].length, i + 1 < heads.length ? heads[i + 1].index : ex.length).trim().replace(/[;,]\s*$/, '').trim();
    const k = +h[1], v = FC.parseNum(raw);
    if (!isNum(v)) bad.push(`разовые «${h[0]}${raw}»`);
    else if (k < 1 || k > p.months) bad.push(`разовые «${h[0]} ${raw}» вне срока`);
    else extra[k] = num(extra[k]) + v;
  });
  p.skip = skip; p.extra = extra;
  return { p, bad, badFields };
}
let calcRes = null;
function updateCalc() {
  const out = $('#calc-out'); if (!out || !UI.calc) return;
  const { p, bad, badFields } = parseCalc(UI.calc);

  for (const k of Object.keys(CALC_NAMES)) { const el = document.querySelector(`[data-calc="${k}"]`); if (el) el.classList.toggle('bad', badFields.includes(k)); }
  const pe = $('#c-parse');
  pe.textContent = bad.length ? `Не понял: ${bad.join('; ')} — эта часть не учтена.` : '';
  pe.classList.toggle('err', !!bad.length);

  out.innerHTML = `

    <div class="chart-legend"><span><i class="k box" style="background:var(--s1)"></i>Свои деньги</span><span><i class="k box" style="background:var(--s2)"></i>Доход вложений</span></div>`;
  $('#calc-tables').innerHTML = `
    <div class="tbl-wrap" style="margin-top:16px"><table class="t"><thead><tr><th>Как начисляется доход</th><th class="n">Пополнение в конце месяца</th><th class="n">в начале месяца</th><th class="n">Доход (в конце)</th></tr></thead>
      <tbody>${cmpEnd.map((x, i) => `<tr class="${x.key === sel ? 'base' : ''}"><td class="wrap">${esc(x.name)}</td><td class="n">${M(x.r.final)}</td><td class="n">${M(cmpStart[i].r.final)}</td><td class="n">${FC.signed(x.r.income)}</td></tr>`).join('')}</tbody></table></div>
    <details class="more" style="margin-top:12px"><summary>Таблица по месяцам</summary><div class="tbl-wrap" style="margin-top:8px;max-height:420px;overflow:auto"><table class="t"><thead><tr><th>Месяц</th><th class="n">Пополнение</th><th class="n">Начислено</th><th class="n">Свои</th><th class="n">Доход всего</th><th class="n">Сумма</th></tr></thead>
      <tbody>${r.rows.slice(1).map(x => `<tr><td>${x.m}</td><td class="n">${M(x.contrib)}</td><td class="n">${M(x.interest)}</td><td class="n">${M(x.own)}</td><td class="n">${M(x.total - x.own)}</td><td class="n">${M(x.total)}</td></tr>`).join('')}</tbody></table></div></details>`;
  const slider = $('#c-m');
  slider.max = p.months;
  if (UI.calc.m == null || UI.calc.m > p.months) UI.calc.m = p.months;
  slider.value = UI.calc.m;

function updateCalcMonth() {
  if (!calcRes) return;

function niceScale(lo, hi, n = 5) {

}

  el._geo = { x, y, n, m, W, H, band, isBar };

  parts.push(`<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`);
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 76))));

      parts.push(`<polygon points="${top.concat(bot).join(' ')}" style="fill:${s.color};fill-opacity:.14;stroke:none"/>`);

      if (v) return warn(`На ${esc(FC.dateLong(o.date))} у счёта «${esc((accById(v.acc) || {}).name || '')}» уже записана новая стоимость. Эта операция изменит её. Если сумма уже входит в ту стоимость — не записывайте.`, 'Записать');
    }
    // хватает ли денег на счёте, с которого они уходят (по учёту на сегодня, без самой правки)
    const src = o.type === 'pay' ? o.acc2 : ['out', 'xfer'].includes(o.type) || (o.type === 'trade' && o.side === 'buy') ? o.acc : null;
    const S = src && accById(src);
    if (S && !FC.isLiab(S) && !(o.qty > 0 && o.type !== 'trade')) {
      const so = comp.accs[src] || {};
      const prevOp = editId ? Store.data.ops.find(x => x.id === editId) : null;
      const back = prevOp && prevOp.acc === src && ['out', 'xfer', 'trade'].includes(prevOp.type) ? num(prevOp.amt) : prevOp && prevOp.type === 'pay' && prevOp.acc2 === src ? num(prevOp.amt) : 0;
      const have = (FC.unitsOn(S) ? so.cash : so.value) + back;
      const r = S.ccy && S.ccy !== 'KZT' ? FC.rateAt(settings().rates, S.ccy, o.date) : 1;
      const need = o.type === 'pay' ? (r > 0 ? o.amt / r : 0) : o.amt;
      if (need > have + 0.5) return warn(`На счёте «${esc(S.name)}» по учёту только ${esc(M(have, S.ccy))}${FC.unitsOn(S) ? ' свободных денег' : ''}. Если сумма верная — сначала запишите пополнение или начальный остаток.`, 'Всё равно записать');
    }
  }
  const before = editId ? Store.data.ops.find(x => x.id === editId) : null;
  const btn = $('#op-save');
  const gen = modalGen;
  const ok = await commitFrom(btn, () => Store.put('ops', o.id, o));
  if (!ok) return;
  if (!editId) {   // в следующий раз такой тип записи откроется с этим же счётом
    UI.lastAcc = { ...(UI.lastAcc || {}), [o.type]: o.acc };
    if (o.type === 'xfer') UI.lastXfer = { acc: o.acc, acc2: o.acc2 };
    saveUI();
  }
  if (gen === modalGen) closeModal();   // окно могли закрыть, пока шло сохранение, — тогда чужое окно не трогаем
  const msg = editId ? 'Изменено' : (o.date > today() ? 'Записано на будущую дату — посчитается в тот день' : 'Записано');
  toast(msg, 'Отменить', () => (before ? Store.put('ops', o.id, before) : Store.put('ops', o.id, null)).catch(e => toast(failText(e))));
}

async function saveAcc(f, a) {
  const errs = {};
  const name = String(f.name || '').trim();
  if (!name) errs.name = 'Назовите счёт';
  const n = k => { const v = amt(f[k]); return isNum(v) ? v : null; };
  const blank = k => String(f[k] ?? '').trim() === '';
  const acc = { ...(a || {}), id: a ? a.id : f._id, name: name.slice(0, 60), cat: f.cat, platform: String(f.platform || '').trim().slice(0, 40) };
  for (const k of ['open', 'openD', 'openQ', 'debt', 'debtD', 'goalSel', 'from', '_id', '_openId']) delete acc[k];
  const s = settings();
  if (f.cat === 'loan') {
    acc.ccy = 'KZT';
    const r = n('rate'), p = n('payment');
    if (r == null || r < 0 || r > 200) errs.rate = 'Укажите ставку от 0 до 200'; else acc.rate = r;
    if (p == null || p < 0) errs.payment = 'Укажите платёж'; else acc.payment = p;
    for (const k of ['goal', 'reserve', 'ret', 'cut', 'units']) delete acc[k];
  } else {
    acc.ccy = f.ccy || 'KZT';
    if (acc.ccy !== 'KZT' && !isNum(FC.rateAt(s.rates, acc.ccy, today())) && !(a && a.ccy === acc.ccy)) errs.ccy = `Сначала задайте курс ${acc.ccy} в «Настройках»`;
    const gs = f.goalSel || (a ? (a.reserve ? 'reserve' : a.goal === false ? 'none' : 'goal') : ((CATS[f.cat] || {}).goal ? 'goal' : 'none'));
    acc.reserve = gs === 'reserve'; acc.goal = gs === 'goal';
    if (blank('ret')) delete acc.ret; else { const r = n('ret'); if (r == null || r < -50 || r > 100) errs.ret = 'От −50 до 100'; else acc.ret = r; }
    if (blank('cut')) delete acc.cut; else { const c = n('cut'); if (c == null || c < 0 || c > 100) errs.cut = 'От 0 до 100'; else acc.cut = c; }
    const unitsDef = (CATS[f.cat] || {}).units;
    const u = f.units != null ? !!f.units : unitsDef;
    if (u !== unitsDef) acc.units = u; else delete acc.units;
  }
  if (a) acc.archived = !!f.archived;
  const ops = [];
  if (!a) {
    if (f.cat === 'loan') {
      const d = n('debt'), dd = f.debtD || today();
      if (blank('debt') || d == null || d < 0) errs.debt = 'Укажите остаток долга';
      else if (!FC.validDate(dd) || dd > today()) errs.debt = 'Неверная дата остатка';
      else if (d > 0) ops.push({ id: f._openId, ts: Date.now(), date: dd, type: 'open', acc: acc.id, amt: d, note: 'Долг на начало учёта' });
    }
    else if (!blank('open')) {
      const v = n('open');
      if (v == null || v < 0) errs.open = 'Введите число не меньше нуля';
      else if (v > 0) {
        const d = f.openD || today();
        if (!FC.validDate(d)) errs.open = 'Неверная дата';
        // есть другие свои счета — человек выбирает, новые это деньги или переложенные: иначе капитал удвоится
        const srcList = fromAccs(acc.ccy);
        const from = srcList.length ? f.from : 'new';
        const S = from && from !== 'new' && from !== 'in' ? srcList.find(x => x.id === from) || null : null;
        if (!from) errs.from = 'Выберите, откуда деньги';
        else if (from !== 'new' && from !== 'in' && !S) errs.from = 'Выберите, откуда деньги';   // источник другой валюты или уже не в списке
        else if (from === 'in') {   // отложил сейчас из дохода — это пополнение: попадёт в «отложено за месяц»
          const o = { id: f._openId, ts: Date.now(), date: d, type: 'in', acc: acc.id, amt: v, note: 'Отложил на новый счёт' };
          const q = n('openQ'); if (q > 0) o.qty = q;
          if (acc.ccy !== 'KZT') { const r = FC.rateAt(s.rates, acc.ccy, d); if (isNum(r)) o.fx = r; }
          ops.push(o);
        } else if (S) {
          const so = comp.accs[S.id] || {}, have = num(FC.unitsOn(S) ? so.cash : so.value);
          if (v > have + 0.5) errs.open = `На «${S.name}» по учёту только ${M(have, S.ccy)}`;
          const o = { id: f._openId, ts: Date.now(), date: d, type: 'xfer', acc: S.id, acc2: acc.id, amt: v, note: 'Переложил на новый счёт' };
          const q = n('openQ'); if (q > 0) o.qty2 = q;
          ops.push(o);
        } else {
          const o = { id: f._openId, ts: Date.now(), date: d, type: 'open', acc: acc.id, amt: v, note: 'Остаток на начало учёта' };
          const q = n('openQ'); if (q > 0) o.qty = q;
          if (acc.ccy !== 'KZT') { const r = FC.rateAt(s.rates, acc.ccy, d); if (isNum(r)) o.fx = r; }
          ops.push(o);
        }
      }
    }
  }
  $$('#modal-b [data-err]').forEach(e => { e.textContent = errs[e.dataset.err] || ''; });
  if (Object.keys(errs).length) return;
  const gen = modalGen;
  const ok = await commitFrom($('#a-save'), async () => { await Store.put('acc', acc.id, acc); for (const o of ops) await Store.put('ops', o.id, o); });
  if (!ok) return;
  if (gen === modalGen) closeModal();
  toast(a ? 'Счёт сохранён' : 'Счёт добавлен');
}

// Отдельная страница поверх приложения: листы книги с цветами и форматами, строка формулы, скачивание .xlsx.
// Данные — в базе (blob «xl-meta», «xl-s<n>», «xl-file»); на сайт и в GitHub модель не попадает.
const XL = { meta: null, sheets: new Map(), cur: 0, hidden: false, zoom: 13, loading: false };

function xlEl() {
  let el = $('#xl');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'xl'; el.className = 'xl'; el.hidden = true;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Excel-модель');
  el.innerHTML = `<div class="xl-top"><button class="btn sm" data-xl="close">← Назад</button><div class="xl-title"><b>Excel-модель</b><span class="small muted" id="xl-sub"></span></div>
    <span class="spacer"></span><div class="xl-tools" id="xl-tools"></div></div>
    <div class="xl-sheets" id="xl-sheets"></div>
    <div class="xl-bar" id="xl-bar"><span class="xl-addr" id="xl-addr">—</span><span class="xl-fx" id="xl-fx">Нажмите на ячейку — здесь будет её значение и формула</span></div>
    <div class="xl-grid" id="xl-grid"></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-xl]');
    if (b) {
      const a = b.dataset.xl;
      if (a === 'close') closeExcel();
      if (a === 'sheet') xlShow(+b.dataset.i);
      if (a === 'hidden') { XL.hidden = !XL.hidden; xlShow(XL.cur); }
      if (a === 'zin' || a === 'zout') { XL.zoom = Math.max(9, Math.min(17, XL.zoom + (a === 'zin' ? 1 : -1))); el.style.setProperty('--xlz', XL.zoom + 'px'); xlShow(XL.cur); }
      if (a === 'dl') xlDownload();
      if (a === 'upload') xlPick();
      return;
    }
    const td = e.target.closest('td[data-r]');
    if (td) xlSelect(td);
  });
  return el;
}
let xlHist = false;
async function openExcel(sheet) {
  const el = xlEl();

  el.style.setProperty('--xlz', XL.zoom + 'px');
  for (const x of [$('header.top'), $('#view'), $('#fab')]) if (x) x.inert = true;
  try { history.pushState({ xl: 1 }, ''); xlHist = true; } catch (e) { xlHist = false; }
  await xlLoadMeta();

  if (sheet && XL.meta) { const i = XL.meta.sheets.findIndex(x => String(x.name).toLowerCase() === String(sheet).toLowerCase()); if (i >= 0 && i !== XL.cur) xlShow(i); }
